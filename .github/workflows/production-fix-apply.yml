# Trigger verified production-fix run.
name: Apply Production Fixes

on:
  push:
    branches:
      - production-fix-2026-08-18
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[production-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-fix-2026-08-18
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Apply deterministic bug fixes
        shell: python
        run: |
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'PATCH TARGET NOT FOUND: {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          replace('lib/sale_service.dart', "'tax': withTax ? (totals['tax'] ?? 0.0) : 0.0,", "'tax': withTax ? ((totals['cgst'] as num?)?.toDouble() ?? 0.0) + ((totals['sgst'] as num?)?.toDouble() ?? 0.0) : 0.0,")

          replace('lib/sales_entry_page.dart', "final gstPct    = double.tryParse(e['gst']?.text.trim() ?? '0') ?? 0.0;\n      \n      final lineSub   = qty * price;", "final gstPct    = double.tryParse(e['gst']?.text.trim() ?? '0') ?? 0.0;\n      final discount  = double.tryParse(e['discount']?.text.trim() ?? '0') ?? 0.0;\n      final effectivePrice = math.max(0.0, price - discount);\n      \n      final lineSub   = qty * effectivePrice;")
          replace('lib/sales_entry_page.dart', "'price':        price.toString(),\n        'qty':          qty,", "'price':        effectivePrice.toString(),\n        'qty':          qty,\n        'discount':     discount.toString(),")

          p=Path('lib/attendance_offline_service.dart'); s=p.read_text(encoding='utf-8')
          start=s.index('  /// Starts a new attendance session.'); end=s.index('  /// Closes the currently open session',start)
          new='''  /// Marks attendance once per employee per calendar day.\n  /// The backend is the final authority and rejects duplicate daily marks.\n  static Future<bool> checkIn({required int employeeId,int? workerId}) async {\n    final now=DateTime.now();\n    final date=_date(now);\n    final sessions=await _findTodaySessions(employeeId:employeeId,workerId:workerId,date:date);\n    if(sessions.isNotEmpty)return false;\n    const sessionIndex=0;\n    final operationId='ATT_IN_${workerId??employeeId}_${date}';\n    await _upsertSession(employeeId:employeeId,workerId:workerId,date:date,sessionIndex:sessionIndex,checkIn:now,status:'PRESENT');\n    final queued=await SyncQueueManager.enqueue('attendance_check_in',{'operation_id':operationId,'idempotency_key':operationId,'employee_id':employeeId,'worker_id':workerId,'attendance_date':date,'session_index':sessionIndex});\n    if(!queued)throw StateError('Unable to persist attendance check-in to durable outbox');\n    return true;\n  }\n\n'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')

          replace('lib/payment_event.dart', "final fiveMinBucket = (timestamp.minute / 5).floor();", "final twoMinBucket = ((timestamp.hour * 60 + timestamp.minute) / 2).floor();")
          replace('lib/payment_event.dart', "'$appFamily'\n        '$hourBucket$fiveMinBucket';", "'$appFamily'\n        '$hourBucket$twoMinBucket';")
          old="""// Bank SMS and all bank apps share one family —
      // the SMS confirming a PhonePe payment comes from the bank, not PhonePe.
      // So we use a generic 'bank' bucket for all bank-sourced events.
      case PaymentApp.bankSms:
      case PaymentApp.bankApp:
      case PaymentApp.icici:
      case PaymentApp.sbiYono:
      case PaymentApp.axis:
      case PaymentApp.hdfc:        return 'bank';
      default:                     return 'upi';"""
          new="""// All payment channels share one family for the non-UTR fallback
      // so an app notification and its bank SMS can deduplicate across sources.
      case PaymentApp.googlePay:
      case PaymentApp.phonePe:
      case PaymentApp.paytm:
      case PaymentApp.amazonPay:
      case PaymentApp.bhim:
      case PaymentApp.whatsappPay:
      case PaymentApp.bankSms:
      case PaymentApp.bankApp:
      case PaymentApp.icici:
      case PaymentApp.sbiYono:
      case PaymentApp.axis:
      case PaymentApp.hdfc:
      case PaymentApp.cred:
      case PaymentApp.payzapp:
      case PaymentApp.unknown:
        return 'upi';
      default:
        return 'upi';"""
          replace('lib/payment_event.dart',old,new)

          # Static analyze() has no unverified-package context, so explicitly
          # keep it on the conservative non-fallback path. Live notifications
          # pass the real flag through _processText/_runPipeline.
          replace('lib/payment_detection_service.dart', "      source: source,\n    );\n\n    score -= fraud.riskScore * 0.35;", "      source: source,\n      isUnverifiedApp: false,\n    );\n\n    score -= fraud.riskScore * 0.35;")

          replace('lib/attendance_page.dart', "      if (_mySession == null) {\n        await OfflineAttendanceService.checkIn(employeeId: _userId!);\n        _showSnack('✅ Checked In — saved offline and queued for sync', _present);\n      } else {", "      if (_mySession == null) {\n        final marked = await OfflineAttendanceService.checkIn(employeeId: _userId!);\n        if (!marked) {\n          _showSnack('ℹ️ Attendance already marked for today', _primary);\n          await _fetch();\n          return;\n        }\n        _showSnack('✅ Attendance marked for today — saved offline and queued for sync', _present);\n      } else {")

      - name: Format and validate Flutter
        run: |
          flutter pub get
          dart format lib
          flutter analyze
          flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Commit verified fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib .github/workflows/production-fix-apply.yml
          git rm -f .github/workflows/production-fix-apply.yml
          git commit -m "Fix production billing payment and attendance bugs [production-fix-applied]"
          git push origin production-fix-2026-08-18
