name: Production Fix Followup
on:
  push:
    branches: [production-fix-2026-08-18]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[production-fix-followup-applied]') && !contains(github.event.head_commit.message, '[production-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-fix-2026-08-18
          fetch-depth: 0
      - name: Patch lifecycle and compile-safe cleanup
        shell: python
        run: |
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'PATCH TARGET NOT FOUND: {path}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Add an explicit local stop operation. It prevents notification/SMS/
          # accessibility events from affecting a sale after the user disables
          # detection, while keeping the singleton reusable for the next sale.
          replace('lib/payment_detection_service.dart', """  void setBackgroundMode(bool isBg) {
    _isBackground = isBg;""", """  Future<void> stop() async {
    _isStarted = false;
    _healthTimer?.cancel();
    _tcmDrainTimer?.cancel();
    _dedupTimer?.cancel();
    _dedupSaveTimer?.cancel();
    _guardTimer?.cancel();
    _midnightTimer?.cancel();
    await _notifSub?.cancel();
    _notifSub = null;
    await _accessSub?.cancel();
    _accessSub = null;
    _watchdog.dispose();
    PdsLogger.i('SVC', 'Payment detection stopped by user');
  }

  void setBackgroundMode(bool isBg) {
    _isBackground = isBg;""")

          # Do not show a remaining amount in the fixed-amount QR label.
          # The QR encodes the sale total; remaining is displayed separately.
          replace('lib/features/sales_entry/widgets/smart_payment_section.dart', "'Scan to Pay ₹${provider.remainingDue.toStringAsFixed(2)} remaining'", "'Scan to Pay ₹${provider.totalAmount.toStringAsFixed(2)}'")

          # Avoid nullable Future passed to unawaited during provider disposal.
          replace('lib/features/sales_entry/controllers/sales_entry_provider.dart', """  @override
  void dispose() {
    unawaited(_paymentSubscription?.cancel());
    unawaited(_paymentDetectionService.stop());""", """  @override
  void dispose() {
    final sub = _paymentSubscription;
    _paymentSubscription = null;
    if (sub != null) unawaited(sub.cancel());
    unawaited(_paymentDetectionService.stop());""")

      - name: Validate
        run: |
          flutter pub get
          dart format lib
          flutter analyze
          flutter test
          flutter build apk --debug
      - name: Commit and remove followup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib .github/workflows/production-fix-followup.yml
          git rm -f .github/workflows/production-fix-followup.yml
          git commit -m "Harden payment detection lifecycle [production-fix-followup-applied]"
          git push origin production-fix-2026-08-18
