name: Production payment partial-match fix

on:
  push:
    branches: [production-fix-2026-08-18]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix genuine partial payments
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/payment_detection_service.dart')
          text = path.read_text(encoding='utf-8-sig')
          original = text

          # Business rule: every genuine payment amount greater than zero and
          # not exceeding the remaining bill is a valid partial payment.
          # The previous 50%-of-remaining floor rejected small legitimate
          # payments such as ₹2 against a ₹10 remaining balance.
          patterns = [
              (r'detected\s*>=\s*remaining\s*\*\s*0\.5', 'detected > 0 && detected <= remaining'),
              (r'detected\s*>=\s*remaining\s*\*\s*0\.50', 'detected > 0 && detected <= remaining'),
          ]

          changed = False
          for pattern, replacement in patterns:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count:
                  changed = True
                  break

          if not changed:
              raise SystemExit('Verified partial-payment 50% condition was not found; refusing an unsafe blind edit.')

          path.write_text(text, encoding='utf-8')
          print('Applied partial-payment rule:', original != text)
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/payment_detection_service.dart
          git commit -m 'fix: accept valid small partial payments'
          rm -f .github/workflows/production-payment-partial-fix.yml
          git add -A
          git commit -m 'chore: remove one-time payment fix workflow' || true
          git push origin HEAD:production-fix-2026-08-18
