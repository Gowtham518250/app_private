name: Fix Payment Detection Settings Open

on:
  workflow_dispatch:
  push:
    branches:
      - production-fix-2026-08-18

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[payment-settings-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-fix-2026-08-18
          fetch-depth: 0

      - name: Patch dashboard payment settings action
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/dashboard_page.dart')
          text = p.read_text(encoding='utf-8')

          old = """            _compactIconButton(\n              Icons.notifications_active_rounded,\n              'Payment Detection',\n              () => _schedulePaymentDetectionReminder(force: true),\n              isPrimary: true,\n            ),"""

          new = """            _compactIconButton(\n              Icons.notifications_active_rounded,\n              'Payment Detection',\n              _openPaymentDetectionSettings,\n              isPrimary: true,\n            ),"""

          if old in text:
              text = text.replace(old, new, 1)

          marker = "  Future<void> _schedulePaymentDetectionReminder({bool force = false}) async {"
          helper = r'''  Future<void> _openPaymentDetectionSettings() async {
    if (!mounted) return;
    await showDialog<void>(
      context: context,
      barrierDismissible: true,
      builder: (ctx) => AlertDialog(
        title: const Text('Payment Detection Settings'),
        content: const Text(
          'Review and enable the Android permissions required for SMS and notification payment detection.',
        ),
        actions: [
          TextButton(
            onPressed: () async {
              Navigator.of(ctx).pop();
              await openAppSettings();
            },
            child: const Text('APP SETTINGS'),
          ),
          FilledButton(
            onPressed: () async {
              Navigator.of(ctx).pop();
              try {
                await PaymentDetectionService().ensureChannelsRunning();
              } catch (e) {
                if (kDebugMode) debugPrint('Payment detection start failed: $e');
              }
              if (mounted) {
                await Future<void>.delayed(const Duration(milliseconds: 300));
                await _checkPermissions(showReminderIfMissing: false);
              }
            },
            child: const Text('START DETECTION'),
          ),
        ],
      ),
    );
  }

'''

          if marker in text and 'Future<void> _openPaymentDetectionSettings()' not in text:
              text = text.replace(marker, helper + marker, 1)

          p.write_text(text, encoding='utf-8')

      - name: Validate and commit
        shell: bash
        run: |
          flutter --version || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/dashboard_page.dart .github/workflows/fix-payment-detection-settings-open.yml
          git rm -f .github/workflows/fix-payment-detection-settings-open.yml
          git commit -m 'fix: make payment detection settings open directly [payment-settings-fixed]'
          git push origin production-fix-2026-08-18