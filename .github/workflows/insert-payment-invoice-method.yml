name: Insert payment invoice method

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/insert_payment_invoice_reconcile.py
      - name: Commit and clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/dashboard_page.dart
          rm -f scripts/insert_payment_invoice_reconcile.py .github/workflows/insert-payment-invoice-method.yml
          git add -u scripts/insert_payment_invoice_reconcile.py .github/workflows/insert-payment-invoice-method.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix detected payment invoice reconciliation'
          git push
