name: Apply Reference Payment Fix

on:
  push:
    branches:
      - production-fix-2026-08-18
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[reference-payment-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-fix-2026-08-18
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Apply targeted reference logic
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'PATCH TARGET NOT FOUND: {path}: {old[:200]!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          # 1) Reference-compatible DLT sender normalization.
          replace(
              'lib/payment_detection_service.dart',
              """  static bool isKnown(String n) => _s.contains(n);""",
              """  static bool isKnown(String n) {
      var normalized = n.toUpperCase().trim();
      normalized = normalized.replaceFirst(RegExp(r'-[A-Z]$'), '');
      return _s.contains(normalized);
    }"""
          )
          replace(
              'lib/payment_detection_service.dart',
              """    'NSDLPB',""",
              """    'NSDLPB', 'APGB',"""
          )

          # 2) DLT sender normalization at the service boundary too.
          replace(
              'lib/payment_detection_service.dart',
              """    final dlt = RegExp(r'^[A-Z]{2}-(.+)$').firstMatch(s);
    if (dlt != null) s = dlt.group(1)!;
    return _BankSenderRegistry.isKnown(s);""",
              """    final dlt = RegExp(r'^[A-Z]{2}-(.+)$').firstMatch(s);
    if (dlt != null) s = dlt.group(1)!;
    s = s.replaceFirst(RegExp(r'-[A-Z]$'), '');
    return _BankSenderRegistry.isKnown(s);"""
          )

          # 3) Partial payments: accept any positive amount below remaining due.
          replace(
              'lib/payment_detection_service.dart',
              """    final tol  = math.max(remaining * 0.05, 2.0);
    final diff = (detected - remaining).abs();

    if (diff <= tol)                          return BillMatchResult.exact;
    if (detected >= remaining * 0.5 &&
        detected  < remaining - tol)          return BillMatchResult.partial;
    if (detected  > expectedAmount! * 2.0)    return BillMatchResult.suspicious;
    return BillMatchResult.mismatch;""",
              """    const tol = 0.01;
    final diff = (detected - remaining).abs();

    if (diff <= tol) return BillMatchResult.exact;
    if (detected > 0 && detected < remaining - tol) return BillMatchResult.partial;
    if (detected > expectedAmount! * 2.0) return BillMatchResult.suspicious;
    return BillMatchResult.mismatch;"""
          )

          # 4) Verified-app local QR match can confirm exact OR partial payments.
          replace(
              'lib/payment_detection_service.dart',
              """      final strongVerifiedAppBillAnchor = source == 'notification' &&
          isTrustedApp &&
          billResult == BillMatchResult.exact &&
          _Classifier.hasStructuredPaymentContext(text);""",
              """      final strongVerifiedAppBillAnchor = source == 'notification' &&
          isTrustedApp &&
          (billResult == BillMatchResult.exact || billResult == BillMatchResult.partial) &&
          _Classifier.hasStructuredPaymentContext(text);"""
          )

          # 5) Do not downgrade a valid trusted partial QR payment.
          replace(
              'lib/payment_detection_service.dart',
              """      // Partial payments always stay LIKELY
      final finalDecision = (isPartial && decision == PaymentDecision.confirmed)
          ? PaymentDecision.likely
          : decision;""",
              """      // A valid partial payment remains confirmed when the local
      // QR session is the trusted bill-match anchor.
      final finalDecision = decision;"""
          )

      - name: Validate
        run: |
          flutter pub get
          dart format lib/payment_detection_service.dart
          flutter analyze lib/payment_detection_service.dart

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/payment_detection_service.dart .github/workflows/apply-reference-payment-fix.yml
          git rm -f .github/workflows/apply-reference-payment-fix.yml
          git commit -m "fix: apply reference payment detection logic [reference-payment-fix-applied]"
          git push origin production-fix-2026-08-18
